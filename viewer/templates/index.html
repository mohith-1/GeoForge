<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GeoForge — 3D City Viewer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #0d1117;
  --panel:    #161b22;
  --border:   #21262d;
  --accent:   #58a6ff;
  --green:    #3fb950;
  --orange:   #f78166;
  --yellow:   #e3b341;
  --text:     #c9d1d9;
  --muted:    #6e7681;
  --mono:     'JetBrains Mono', monospace;
  --sans:     'Inter', sans-serif;

  /* Layer colours */
  --building: #58a6ff;
  --road:     #8b949e;
  --water:    #1f6feb;
  --terrain:  #7d5d3b;
  --forest:   #2ea043;
  --bridge:   #d29922;
  --wall:     #6e7681;
  --fence:    #5a3e2b;
  --unknown:  #6e7681;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: grid;
  grid-template-columns: 300px 1fr;
  grid-template-rows: 48px 1fr;
  overflow: hidden;
}

/* ── TOP BAR ─────────────────────────────────────────── */
#topbar {
  grid-column: 1/-1;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 12px;
}
.logo {
  font-family: var(--mono);
  font-size: 16px;
  font-weight: 500;
  color: var(--accent);
  letter-spacing: -0.5px;
}
.logo-sep { color: var(--muted); margin: 0 4px; }
.logo-sub { font-size: 11px; color: var(--muted); font-family: var(--sans); }
.tb-spacer { flex: 1; }
.tb-btn {
  font-family: var(--mono);
  font-size: 11px;
  padding: 5px 12px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  cursor: pointer;
  border-radius: 6px;
  transition: all .15s;
}
.tb-btn:hover { border-color: var(--accent); color: var(--accent); }
.tb-btn.primary { border-color: var(--accent); color: var(--accent); }
.tb-btn.primary:hover { background: var(--accent); color: var(--bg); }
.tb-btn.danger { border-color: var(--orange); color: var(--orange); }
.tb-btn.danger:hover { background: var(--orange); color: var(--bg); }

/* ── SIDEBAR ─────────────────────────────────────────── */
#sidebar {
  background: var(--panel);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
#sidebar::-webkit-scrollbar { width: 4px; }
#sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.section {
  border-bottom: 1px solid var(--border);
  padding: 14px;
}
.section-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--muted);
  margin-bottom: 10px;
}

/* Drop zone */
#dropzone {
  border: 1px dashed var(--border);
  border-radius: 8px;
  padding: 20px 14px;
  text-align: center;
  cursor: pointer;
  transition: all .2s;
  position: relative;
}
#dropzone:hover, #dropzone.over {
  border-color: var(--accent);
  background: rgba(88,166,255,.05);
}
#dropzone .dz-icon { font-size: 24px; margin-bottom: 6px; }
#dropzone .dz-title { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
#dropzone .dz-sub {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.7;
}
#dropzone .dz-sub b { color: var(--accent); }
#dropzone input {
  position: absolute; inset: 0;
  opacity: 0; cursor: pointer;
}

/* Staged files */
#staged-wrap { display: none; margin-top: 10px; }
.staged-file {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 0;
  border-bottom: 1px solid var(--border);
  font-size: 11px;
}
.staged-ext {
  font-family: var(--mono);
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 4px;
  flex-shrink: 0;
}
.ext-las  { background: rgba(63,185,80,.15);  color: var(--green); }
.ext-geo  { background: rgba(88,166,255,.15); color: var(--accent); }
.staged-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.staged-rm { cursor: pointer; color: var(--muted); padding: 2px 4px; border-radius: 3px; }
.staged-rm:hover { color: var(--orange); }

/* Layer class selects */
.cls-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 6px;
  align-items: center;
  margin-top: 5px;
  font-size: 11px;
  background: rgba(255,255,255,.03);
  padding: 5px 8px;
  border-radius: 4px;
  border: 1px solid var(--border);
}
.cls-row select {
  font-family: var(--mono);
  font-size: 10px;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 2px 4px;
  border-radius: 4px;
  cursor: pointer;
}
.pc-ok { font-size: 11px; color: var(--green); padding: 6px 0 0; }
.pc-warn { font-size: 11px; color: var(--yellow); padding: 6px 0 0; }

#build-btn {
  width: 100%;
  margin-top: 10px;
  padding: 8px;
  font-family: var(--mono);
  font-size: 12px;
  background: var(--accent);
  color: var(--bg);
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 500;
  display: none;
  transition: opacity .15s;
}
#build-btn:hover { opacity: .85; }

/* Job status */
#job-section { display: none; }
.job-status-text { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
.progress {
  height: 2px;
  background: var(--border);
  border-radius: 1px;
  margin-bottom: 8px;
  overflow: hidden;
}
.progress-bar {
  height: 100%;
  background: var(--accent);
  width: 0;
  transition: width .3s;
}
.progress-bar.running {
  width: 40%;
  animation: slide 1s ease-in-out infinite;
}
@keyframes slide {
  0%   { margin-left: -40%; }
  100% { margin-left: 100%; }
}
#job-log {
  font-family: var(--mono);
  font-size: 10px;
  line-height: 1.8;
  color: var(--muted);
  max-height: 120px;
  overflow-y: auto;
  background: var(--bg);
  padding: 6px 8px;
  border-radius: 4px;
  border: 1px solid var(--border);
}
.log-ok  { color: var(--green); }
.log-err { color: var(--orange); }

/* Output files */
#out-section { display: none; }
.out-file {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 4px;
  cursor: pointer;
  transition: all .15s;
  font-size: 11px;
}
.out-file:hover  { border-color: var(--accent); }
.out-file.active { border-color: var(--accent); background: rgba(88,166,255,.08); }
.out-file .of-name { flex: 1; }
.out-file .of-badge {
  font-size: 9px;
  padding: 1px 6px;
  background: var(--border);
  color: var(--muted);
  border-radius: 3px;
  text-transform: uppercase;
  font-family: var(--mono);
}
.out-file .of-dl { font-size: 13px; color: var(--muted); text-decoration: none; }
.out-file .of-dl:hover { color: var(--accent); }

/* Layers */
#layers-section { display: none; }
.layer-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 0;
  cursor: pointer;
  transition: opacity .15s;
  font-size: 12px;
}
.layer-row.off { opacity: .3; }
.layer-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
.layer-name { flex: 1; }
.layer-ct { font-size: 10px; color: var(--muted); font-family: var(--mono); }
.layer-eye { font-size: 12px; }

/* Controls */
.ctrl-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 4px 0;
  font-size: 11px;
}
.ctrl-label { color: var(--muted); width: 90px; flex-shrink: 0; }
.ctrl-val   { color: var(--accent); font-family: var(--mono); width: 36px; text-align: right; font-size: 10px; }
input[type=range] {
  flex: 1;
  -webkit-appearance: none;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  outline: none;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px; height: 12px;
  background: var(--accent);
  border-radius: 50%;
  cursor: pointer;
}

/* ── VIEWPORT ─────────────────────────────────────────── */
#viewport {
  position: relative;
  overflow: hidden;
  background: #0a0e14;
}
#canvas { display: block; width: 100%; height: 100%; }

/* Toolbar */
#toolbar {
  position: absolute;
  top: 12px; right: 12px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.tool {
  width: 34px; height: 34px;
  background: rgba(22,27,34,.9);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 15px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  transition: all .15s;
  backdrop-filter: blur(4px);
}
.tool:hover  { border-color: var(--accent); color: var(--accent); }
.tool.active { border-color: var(--accent); background: rgba(88,166,255,.15); color: var(--accent); }
.tool-gap { height: 6px; }

/* Stats */
#stats {
  position: absolute;
  bottom: 12px; left: 12px;
  background: rgba(13,17,23,.88);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 12px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  line-height: 1.9;
  backdrop-filter: blur(4px);
  min-width: 170px;
}
#stats span { color: var(--text); }

/* Compass */
#compass {
  position: absolute;
  bottom: 12px; right: 12px;
  width: 52px; height: 52px;
}

/* Welcome */
#welcome {
  position: absolute; inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  pointer-events: none;
}
#welcome.hidden { display: none; }
#welcome .w1 {
  font-family: var(--mono);
  font-size: 22px;
  font-weight: 500;
  color: rgba(201,209,217,.08);
  letter-spacing: 2px;
}
#welcome .w2 { font-size: 11px; color: rgba(201,209,217,.06); }

/* Measure tooltip */
#mtt {
  position: absolute;
  background: rgba(13,17,23,.9);
  border: 1px solid var(--accent);
  border-radius: 4px;
  padding: 3px 10px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--accent);
  pointer-events: none;
  display: none;
}

/* Toast notification */
#toast {
  position: fixed;
  top: 60px; right: 16px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: 6px;
  padding: 9px 14px;
  font-size: 12px;
  max-width: 280px;
  z-index: 9999;
  opacity: 0;
  transform: translateX(16px);
  transition: all .2s;
  pointer-events: none;
}
#toast.show { opacity: 1; transform: translateX(0); }
#toast.err  { border-left-color: var(--orange); }
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <span class="logo">GeoForge</span>
  <span class="logo-sep">/</span>
  <span class="logo-sub">3D City Viewer</span>
  <div class="tb-spacer"></div>
  <button class="tb-btn" onclick="resetCam()">⟳ Reset</button>
  <button class="tb-btn primary" onclick="loadExample()">▶ Example</button>
  <button class="tb-btn danger" onclick="clearAll()">✕ Clear</button>
</div>

<!-- SIDEBAR -->
<div id="sidebar">

  <!-- DROP ZONE -->
  <div class="section">
    <div class="section-title">Load Files</div>
    <div id="dropzone">
      <div class="dz-icon">📂</div>
      <div class="dz-title">Drop files here</div>
      <div class="dz-sub">
        <b>View:</b> OBJ · CityJSON · STL<br>
        <b>Build:</b> GeoJSON + LAS/LAZ<br>
        <span style="color:var(--muted)">or click to browse</span>
      </div>
      <input type="file" id="file-input" multiple
             accept=".obj,.json,.geojson,.stl,.las,.laz,.shp,.gpkg">
    </div>

    <!-- Staged files list -->
    <div id="staged-wrap">
      <div id="staged-list"></div>
      <div id="cls-assignments"></div>
      <div id="pc-status"></div>
      <button id="build-btn" onclick="doBuild()">⚡ Build 3D Model</button>
    </div>
  </div>

  <!-- JOB STATUS -->
  <div class="section" id="job-section">
    <div class="section-title">Pipeline</div>
    <div class="job-status-text" id="job-status-text">Queued…</div>
    <div class="progress"><div class="progress-bar" id="pbar"></div></div>
    <div id="job-log"></div>
  </div>

  <!-- OUTPUT FILES -->
  <div class="section" id="out-section">
    <div class="section-title">Output Files</div>
    <div id="out-list"></div>
  </div>

  <!-- LAYERS -->
  <div class="section" id="layers-section">
    <div class="section-title">Layers</div>
    <div id="layers-list"></div>
  </div>

  <!-- DISPLAY CONTROLS -->
  <div class="section">
    <div class="section-title">Display</div>
    <div class="ctrl-row">
      <span class="ctrl-label">Sun angle</span>
      <input type="range" min="5" max="89" value="50" id="sl-sun" oninput="setSun(this.value)">
      <span class="ctrl-val" id="sv-sun">50°</span>
    </div>
    <div class="ctrl-row">
      <span class="ctrl-label">Explode</span>
      <input type="range" min="0" max="100" value="0" id="sl-exp" oninput="setExplode(this.value)">
      <span class="ctrl-val" id="sv-exp">0</span>
    </div>
    <div class="ctrl-row">
      <span class="ctrl-label">Opacity</span>
      <input type="range" min="10" max="100" value="100" id="sl-op" oninput="setOpacity(this.value)">
      <span class="ctrl-val" id="sv-op">100%</span>
    </div>
  </div>

</div><!-- /sidebar -->

<!-- VIEWPORT -->
<div id="viewport">
  <canvas id="canvas"></canvas>

  <div id="toolbar">
    <button class="tool" title="Wireframe" id="t-wire" onclick="toggleWire()">⬛</button>
    <button class="tool" title="Top view"   onclick="setView('top')">⬆</button>
    <button class="tool" title="Front view" onclick="setView('front')">◼</button>
    <div class="tool-gap"></div>
    <button class="tool" title="Measure"   id="t-meas" onclick="toggleMeasure()">📏</button>
    <button class="tool" title="Focus"     onclick="focusAll()">⊙</button>
    <div class="tool-gap"></div>
    <button class="tool" title="Screenshot" onclick="doScreenshot()">📷</button>
  </div>

  <div id="stats">
    <div>Vertices  <span id="sv">—</span></div>
    <div>Triangles <span id="st">—</span></div>
    <div>Objects   <span id="so">—</span></div>
    <div>Measure   <span id="sm">—</span></div>
  </div>

  <canvas id="compass" width="52" height="52"></canvas>

  <div id="mtt"></div>

  <div id="welcome">
    <div class="w1">GEOFORGE</div>
    <div class="w2">drop files or click "Example"</div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

// ═══════════════════════════════════════════════════════════
//  SCENE
// ═══════════════════════════════════════════════════════════
const canvas   = document.getElementById('canvas');
const viewport = document.getElementById('viewport');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e14);
scene.fog = new THREE.FogExp2(0x0a0e14, 0.004);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 50000);

// Lights
const ambLight = new THREE.AmbientLight(0x3a4a6a, 0.7);
scene.add(ambLight);

const sun = new THREE.DirectionalLight(0xfff5e0, 1.3);
sun.castShadow = true;
sun.shadow.mapSize.width  = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.radius = 3;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x4060a0, 0.25);
fill.position.set(-1, 0.5, -1);
scene.add(fill);

let grid = new THREE.GridHelper(1000, 40, 0x1a2030, 0x131b27);
scene.add(grid);

// ── Orbit state ─────────────────────────────────────────────
let sph    = { th: Math.PI/4, ph: Math.PI/3.5, r: 300 };
let target = new THREE.Vector3();

function camFromSph() {
  camera.position.set(
    target.x + sph.r * Math.sin(sph.ph) * Math.sin(sph.th),
    target.y + sph.r * Math.cos(sph.ph),
    target.z + sph.r * Math.sin(sph.ph) * Math.cos(sph.th),
  );
  camera.lookAt(target);
  drawCompass();
}
camFromSph();

// ── Mouse orbit ──────────────────────────────────────────────
let drag = false, rightDrag = false, lastM = {x:0,y:0};
canvas.addEventListener('mousedown', e => {
  drag = true; rightDrag = e.button===2;
  lastM = {x:e.clientX, y:e.clientY};
});
window.addEventListener('mouseup', () => drag = false);
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('mousemove', e => {
  if (!drag) return;
  const dx = e.clientX-lastM.x, dy = e.clientY-lastM.y;
  lastM = {x:e.clientX, y:e.clientY};
  if (rightDrag) {
    const sp = sph.r * 0.001;
    const right = new THREE.Vector3().crossVectors(
      camera.getWorldDirection(new THREE.Vector3()), camera.up).normalize();
    target.addScaledVector(right, -dx*sp);
    target.y += dy*sp;
  } else {
    sph.th -= dx*0.005;
    sph.ph  = Math.max(0.05, Math.min(Math.PI*0.94, sph.ph - dy*0.005));
  }
  camFromSph();
});
canvas.addEventListener('wheel', e => {
  sph.r = Math.max(1, Math.min(100000, sph.r * (1 + e.deltaY*0.001)));
  camFromSph();
}, {passive:true});

// Touch orbit
let touches = [];
canvas.addEventListener('touchstart', e => { touches = [...e.touches]; });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1) {
    const dx = e.touches[0].clientX - touches[0].clientX;
    const dy = e.touches[0].clientY - touches[0].clientY;
    sph.th -= dx*0.005; sph.ph = Math.max(0.05,Math.min(Math.PI*0.94,sph.ph-dy*0.005));
  } else if (e.touches.length === 2) {
    const d0 = Math.hypot(touches[0].clientX-touches[1].clientX, touches[0].clientY-touches[1].clientY);
    const d1 = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    sph.r *= d0/d1;
  }
  touches = [...e.touches];
  camFromSph();
}, {passive:false});

// Resize
function resize() {
  const w = viewport.clientWidth, h = viewport.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(viewport);
resize();

// ═══════════════════════════════════════════════════════════
//  LAYER COLOURS
// ═══════════════════════════════════════════════════════════
const CLS_COLOR = {
  building:0x58a6ff, road:0x8b949e, water:0x1f6feb,
  terrain:0x7d5d3b,  forest:0x2ea043, bridge:0xd29922,
  wall:0x6e7681,     fence:0x5a3e2b, unknown:0x6e7681,
};
const CLS_EMIT = {
  building:0x0a1020, water:0x000820, forest:0x001000,
  road:0x080a0c,     terrain:0x100800, bridge:0x100800,
  wall:0x050508,     fence:0x050300, unknown:0x050505,
};

function makeMat(cls) {
  return new THREE.MeshLambertMaterial({
    color:   CLS_COLOR[cls]  || CLS_COLOR.unknown,
    emissive:CLS_EMIT[cls]   || 0x000000,
    side:    THREE.DoubleSide,
  });
}

// ═══════════════════════════════════════════════════════════
//  SCENE OBJECTS
// ═══════════════════════════════════════════════════════════
const objects     = [];   // {mesh, cls}
let   layerGroups = {};
let   layerVis    = {};
let   wireMode    = false;
let   measureOn   = false;
let   mPts        = [];

// ── Add meshes to scene ──────────────────────────────────────
function addMeshes(meshes) {
  if (!meshes.length) { toast('No geometry found', true); return; }

  // Bounding box BEFORE translating
  const box = new THREE.Box3();
  meshes.forEach(m => { m.geometry.computeBoundingBox(); box.expandByObject(m); });
  const centre = box.getCenter(new THREE.Vector3());
  const size   = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);

  if (maxDim === 0 || !isFinite(maxDim)) { toast('Model has zero size', true); return; }

  // Translate everything so model centre = world origin
  meshes.forEach(mesh => {
    mesh.position.sub(centre);
    const cls = mesh.userData.cls || 'unknown';
    if (!layerGroups[cls]) {
      layerGroups[cls] = new THREE.Group();
      scene.add(layerGroups[cls]);
      layerVis[cls] = true;
    }
    layerGroups[cls].add(mesh);
    mesh.userData._origY = mesh.position.y;
    objects.push({mesh, cls});
  });

  // Fit camera
  const fp  = Math.sqrt(size.x**2 + size.z**2);
  sph.r     = Math.max(fp * 1.3, size.y * 5, 30);
  sph.ph    = Math.PI/4;
  sph.th    = Math.PI/4;
  target.set(0, 0, 0);

  // Clip planes
  camera.near = sph.r * 0.001;
  camera.far  = sph.r * 20;
  camera.updateProjectionMatrix();

  // Fog
  scene.fog.density = 1.0 / (sph.r * 5);

  // Sun and shadows
  const sr = Math.max(fp, 100);
  sun.shadow.camera.left   = -sr; sun.shadow.camera.right  = sr;
  sun.shadow.camera.top    =  sr; sun.shadow.camera.bottom = -sr;
  sun.shadow.camera.near   = 1;   sun.shadow.camera.far    = sr*6;
  sun.shadow.camera.updateProjectionMatrix();
  sun.position.set(sr*.8, sr, sr*.6);

  // Grid
  scene.remove(grid);
  const gs = Math.ceil(fp/100)*200;
  grid = new THREE.GridHelper(gs, 40, 0x1a2030, 0x131b27);
  scene.add(grid);

  camFromSph();
  updateStats();
  updateLayers();
  document.getElementById('welcome').classList.add('hidden');
  toast(`Loaded — ${objects.length} objects · ${size.x.toFixed(0)}×${size.z.toFixed(0)} m`);
}

// ═══════════════════════════════════════════════════════════
//  OBJ PARSER
// ═══════════════════════════════════════════════════════════
function parseOBJ(text) {
  const pos = [], meshes = [], geos = {};
  let cur = 'default', curCls = 'unknown';

  for (const raw of text.split('\n')) {
    const line = raw.trim();
    if (!line || line[0]==='#') continue;
    const p = line.split(/\s+/);
    if (p[0]==='v') {
      pos.push(+p[1], +p[2], +p[3]);
    } else if (p[0]==='g') {
      cur = p.slice(1).join(' ') || 'default';
      curCls = detectCls(cur);
      if (!geos[cur]) geos[cur] = {verts:[], idx:[], cls:curCls};
    } else if (p[0]==='f') {
      if (!geos[cur]) geos[cur] = {verts:[], idx:[], cls:curCls};
      const g   = geos[cur];
      const idx = p.slice(1).map(s => parseInt(s)-1);
      for (let i=1; i<idx.length-1; i++) {
        [idx[0],idx[i],idx[i+1]].forEach(vi => {
          // OBJ Y-up swap: v[1]=Y(up) → Z, v[2]=Z → Y
          g.verts.push(pos[vi*3], pos[vi*3+2], pos[vi*3+1]);
        });
        const b = g.verts.length/3;
        g.idx.push(b-3, b-2, b-1);
      }
    }
  }

  for (const [, g] of Object.entries(geos)) {
    if (!g.verts.length) continue;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(g.verts, 3));
    geo.setIndex(g.idx);
    geo.computeVertexNormals();
    const mesh = new THREE.Mesh(geo, makeMat(g.cls));
    mesh.castShadow = mesh.receiveShadow = true;
    mesh.userData.cls = g.cls;
    meshes.push(mesh);
  }
  return meshes;
}

// ═══════════════════════════════════════════════════════════
//  CITYJSON PARSER
// ═══════════════════════════════════════════════════════════
const CJ_CLS = {
  Building:'building', BuildingPart:'building',
  Road:'road', TransportationSquare:'road',
  WaterBody:'water', TINRelief:'terrain', LandUse:'terrain',
  PlantCover:'forest', SolitaryVegetationObject:'forest',
  Bridge:'bridge', BridgePart:'bridge',
  GenericCityObject:'unknown',
};

function parseCityJSON(data) {
  const raw = data.vertices;
  const tx  = data.transform || {scale:[1,1,1],translate:[0,0,0]};
  const [sx,sy,sz] = tx.scale;
  const [ox,oy,oz] = tx.translate;

  // Pre-decode all vertices to real-world coords
  const verts = raw.map(v => [v[0]*sx+ox, v[1]*sy+oy, v[2]*sz+oz]);
  const meshes = [];

  for (const [oid, obj] of Object.entries(data.CityObjects||{})) {
    const cls   = CJ_CLS[obj.type] || 'unknown';
    const allV  = [], allI = [];

    for (const geom of (obj.geometry||[])) {
      if (!geom.boundaries) continue;
      for (const surface of geom.boundaries) {
        // Normalise ring nesting: we want an array of vertex-index arrays
        let rings;
        if (typeof surface[0] === 'number') {
          rings = [surface];
        } else if (Array.isArray(surface[0]) && typeof surface[0][0]==='number') {
          rings = surface;
        } else {
          rings = (surface.flat ? surface.flat(1) : surface);
          if (!Array.isArray(rings[0])) rings = [rings];
        }
        for (const ring of rings) {
          const flat = ring.flat ? ring.flat(Infinity) : ring;
          const pts  = [];
          for (const vi of flat) {
            if (typeof vi!=='number' || vi>=verts.length) continue;
            const v = verts[vi];
            // Three.js Y-up: geo-X→X, geo-Z→Y(up), geo-Y→Z
            pts.push(v[0], v[2], v[1]);
          }
          if (pts.length < 9) continue;
          const base = allV.length/3;
          for (const p of pts) allV.push(p);
          const n = pts.length/3;
          for (let i=1; i<n-1; i++) allI.push(base, base+i, base+i+1);
        }
      }
    }

    if (!allV.length) continue;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(allV, 3));
    geo.setIndex(allI);
    geo.computeVertexNormals();
    const mesh = new THREE.Mesh(geo, makeMat(cls));
    mesh.castShadow = mesh.receiveShadow = true;
    mesh.userData = {cls, id:oid};
    meshes.push(mesh);
  }
  return meshes;
}

// ═══════════════════════════════════════════════════════════
//  STL PARSER (binary)
// ═══════════════════════════════════════════════════════════
function parseSTL(buf) {
  const view = new DataView(buf);
  const n    = view.getUint32(80, true);
  const v    = new Float32Array(n*9);
  let off    = 84;
  for (let i=0; i<n; i++) {
    off += 12; // skip normal
    for (let j=0; j<9; j++) { v[i*9+j]=view.getFloat32(off,true); off+=4; }
    off += 2;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(v, 3));
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, makeMat('unknown'));
  mesh.castShadow = mesh.receiveShadow = true;
  mesh.userData.cls = 'unknown';
  return [mesh];
}

// ═══════════════════════════════════════════════════════════
//  UNIVERSAL FILE ROUTER
// ═══════════════════════════════════════════════════════════
const VIEW_EXT     = new Set(['obj','stl']);
const PIPELINE_EXT = new Set(['geojson','las','laz','shp','gpkg','fgb']);
const pFiles       = {};   // filename -> File

const dz    = document.getElementById('dropzone');
const finp  = document.getElementById('file-input');

finp.addEventListener('change', () => routeFiles(finp.files));
dz.addEventListener('dragover',  e => { e.preventDefault(); dz.classList.add('over'); });
dz.addEventListener('dragleave', ()  => dz.classList.remove('over'));
dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('over'); routeFiles(e.dataTransfer.files); });

// Also drop on viewport
viewport.addEventListener('dragover',  e => { e.preventDefault(); viewport.style.outline='2px dashed var(--accent)'; });
viewport.addEventListener('dragleave', ()  => viewport.style.outline='');
viewport.addEventListener('drop', e => { e.preventDefault(); viewport.style.outline=''; routeFiles(e.dataTransfer.files); });

async function routeFiles(files) {
  const viewQ = [], pipeQ = [];
  for (const f of files) {
    const ext = f.name.split('.').pop().toLowerCase();
    if (VIEW_EXT.has(ext)) {
      viewQ.push(f);
    } else if (PIPELINE_EXT.has(ext)) {
      pipeQ.push(f);
    } else if (ext === 'json') {
      // Peek inside
      try {
        const snip = await f.slice(0,300).text();
        if (snip.includes('CityJSON')) viewQ.push(f);
        else if (snip.includes('FeatureCollection')||snip.includes('"Feature"')) pipeQ.push(f);
        else viewQ.push(f);
      } catch { viewQ.push(f); }
    }
  }
  for (const f of viewQ)  await loadViewFile(f);
  for (const f of pipeQ) { pFiles[f.name] = f; }
  if (pipeQ.length) renderStaged();
}

async function loadViewFile(f) {
  const ext = f.name.split('.').pop().toLowerCase();
  try {
    if (ext==='obj') {
      addMeshes(parseOBJ(await f.text()));
    } else if (ext==='stl') {
      addMeshes(parseSTL(await f.arrayBuffer()));
    } else if (ext==='json') {
      const d = JSON.parse(await f.text());
      if (d.type==='CityJSON') addMeshes(parseCityJSON(d));
      else toast('JSON is not CityJSON', true);
    }
  } catch(e) { toast(`Load error: ${e.message}`, true); }
}

// ═══════════════════════════════════════════════════════════
//  STAGED FILES UI
// ═══════════════════════════════════════════════════════════
const CLASSES = ['building','road','water','terrain','forest','bridge','wall','fence'];

function renderStaged() {
  const wrap = document.getElementById('staged-wrap');
  const list = document.getElementById('staged-list');
  const cls  = document.getElementById('cls-assignments');
  const pcs  = document.getElementById('pc-status');
  wrap.style.display = 'block';
  list.innerHTML = cls.innerHTML = pcs.innerHTML = '';

  let hasPC = false, hasLayer = false;
  for (const fname of Object.keys(pFiles)) {
    const ext   = fname.split('.').pop().toLowerCase();
    const isPC  = ['las','laz'].includes(ext);
    if (isPC) hasPC = true; else hasLayer = true;

    const row = document.createElement('div');
    row.className = 'staged-file';
    row.innerHTML = `
      <span class="staged-ext ${isPC?'ext-las':'ext-geo'}">.${ext}</span>
      <span class="staged-name" title="${fname}">${fname}</span>
      <span class="staged-rm" onclick="removeStaged('${fname}')">✕</span>`;
    list.appendChild(row);
  }

  // Class dropdowns for non-LAS files
  for (const fname of Object.keys(pFiles)) {
    const ext = fname.split('.').pop().toLowerCase();
    if (['las','laz'].includes(ext)) continue;
    const g = guessClass(fname);
    const r = document.createElement('div');
    r.className = 'cls-row';
    r.innerHTML = `
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${fname}">${fname}</span>
      <select data-file="${fname}">
        ${CLASSES.map(c=>`<option value="${c}"${c===g?' selected':''}>${c}</option>`).join('')}
      </select>`;
    cls.appendChild(r);
  }

  // Status message
  if (hasPC) {
    pcs.innerHTML = '<div class="pc-ok">✓ Point cloud ready</div>';
  } else if (hasLayer) {
    pcs.innerHTML = '<div class="pc-warn">⚠ Add a LAS or LAZ file</div>';
  }

  document.getElementById('build-btn').style.display = (hasPC && hasLayer) ? 'block' : 'none';
}

function removeStaged(fname) {
  delete pFiles[fname];
  if (!Object.keys(pFiles).length) {
    document.getElementById('staged-wrap').style.display = 'none';
  } else {
    renderStaged();
  }
}

async function doBuild() {
  const layerConfig = [];
  document.querySelectorAll('#cls-assignments select').forEach(sel => {
    layerConfig.push({filename: sel.dataset.file, class: sel.value});
  });

  const fd = new FormData();
  for (const [fname, file] of Object.entries(pFiles)) fd.append(fname, file, fname);
  fd.append('layer_config', JSON.stringify(layerConfig));

  showJob('Uploading …');
  try {
    const r  = await fetch('/api/build', {method:'POST', body:fd});
    const js = await r.json();
    pollJob(js.job_id);
  } catch(e) { toast('Upload failed: '+e.message, true); }
}

  showJob('Generating example …');
  const r  = await fetch('/api/example');
  const js = await r.json();
  pollJob(js.job_id);
}

// ═══════════════════════════════════════════════════════════
//  JOB POLLING
// ═══════════════════════════════════════════════════════════
function showJob(msg) {
  document.getElementById('job-section').style.display = 'block';
  document.getElementById('job-status-text').textContent = msg;
  document.getElementById('pbar').className = 'progress-bar running';
}

function pollJob(jid) {
  const iv = setInterval(async () => {
    const r   = await fetch(`/api/job/${jid}`);
    const job = await r.json();
    renderJob(job);
    if (job.status==='done' || job.status==='error') {
      clearInterval(iv);
      if (job.status==='done') {
        renderOutputs(job.outputs, jid);
        toast(`✓ Done — ${job.outputs.length} files ready`);
      } else {
        toast('Error: '+job.error, true);
      }
    }
  }, 700);
}

function renderJob(job) {
  const labels = {queued:'Queued…', running:'Running…', done:'Complete ✓', error:'Error ✗'};
  document.getElementById('job-status-text').textContent = labels[job.status]||job.status;
  const bar = document.getElementById('pbar');
  if (job.status==='done') { bar.className='progress-bar'; bar.style.width='100%'; bar.style.background='var(--green)'; }
  else if (job.status==='error') { bar.className='progress-bar'; bar.style.width='100%'; bar.style.background='var(--orange)'; }
  else { bar.className='progress-bar running'; }

  const logEl = document.getElementById('job-log');
  logEl.innerHTML = (job.log||[]).map(l => {
    if (l.includes('ERROR')||l.includes('Error')) return `<div class="log-err">${l}</div>`;
    if (l.includes('✓')||l.includes('Done')||l.includes('complete')||l.includes('built'))
      return `<div class="log-ok">${l}</div>`;
    return `<div>${l}</div>`;
  }).join('');
  logEl.scrollTop = logEl.scrollHeight;
}

function renderOutputs(outputs, jid) {
  const sec  = document.getElementById('out-section');
  const list = document.getElementById('out-list');
  sec.style.display = 'block';
  list.innerHTML = '';

  for (const o of outputs) {
    const row = document.createElement('div');
    row.className = 'out-file';
    const kb = o.size ? ` ${(o.size/1024).toFixed(0)}KB` : '';
    row.innerHTML = `
      <span class="of-name">${o.name}${kb}</span>
      <span class="of-badge">${o.type}</span>
      <a class="of-dl" href="${o.url}" download title="Download">⬇</a>`;
    if (['obj','cityjson','stl'].includes(o.type)) {
      row.onclick = async e => {
        if (e.target.tagName==='A') return;
        document.querySelectorAll('.out-file').forEach(r=>r.classList.remove('active'));
        row.classList.add('active');
        await loadFromURL(o.url, o.type);
      };
    }
    list.appendChild(row);
  }

  // Auto-load best format
  const best = outputs.find(o=>o.type==='cityjson') || outputs.find(o=>o.type==='obj');
  if (best) setTimeout(() => loadFromURL(best.url, best.type), 400);
}

async function loadFromURL(url, type) {
  toast(`Loading ${type} …`);
  clearAll(false);
  try {
    if (type==='cityjson') {
      const d = await (await fetch(url)).json();
      addMeshes(parseCityJSON(d));
    } else if (type==='obj') {
      const t = await (await fetch(url)).text();
      addMeshes(parseOBJ(t));
    } else if (type==='stl') {
      const b = await (await fetch(url)).arrayBuffer();
      addMeshes(parseSTL(b));
    }
    objects.forEach(o => { o.mesh.userData._origY = o.mesh.position.y; });
  } catch(e) { toast('Load failed: '+e.message, true); }
}

// ═══════════════════════════════════════════════════════════
//  LAYERS PANEL
// ═══════════════════════════════════════════════════════════
function updateLayers() {
  const sec  = document.getElementById('layers-section');
  const list = document.getElementById('layers-list');
  if (!Object.keys(layerGroups).length) { sec.style.display='none'; return; }
  sec.style.display = 'block';
  list.innerHTML = '';
  for (const [cls, grp] of Object.entries(layerGroups)) {
    const col  = '#'+(CLS_COLOR[cls]||0x6e7681).toString(16).padStart(6,'0');
    const row  = document.createElement('div');
    row.className = 'layer-row'+(layerVis[cls]?'':' off');
    row.innerHTML = `
      <div class="layer-dot" style="background:${col}"></div>
      <span class="layer-name">${cls}</span>
      <span class="layer-ct">${grp.children.length}</span>
      <span class="layer-eye">${layerVis[cls]?'👁':'○'}</span>`;
    row.onclick = () => {
      layerVis[cls] = !layerVis[cls];
      grp.visible   = layerVis[cls];
      updateLayers();
    };
    list.appendChild(row);
  }
}

// ═══════════════════════════════════════════════════════════
//  CONTROLS
// ═══════════════════════════════════════════════════════════
function resetCam() {
  target.set(0,0,0);
  if (objects.length) {
    const box = new THREE.Box3();
    objects.forEach(o => box.expandByObject(o.mesh));
    const size = box.getSize(new THREE.Vector3());
    const fp = Math.sqrt(size.x**2 + size.z**2);
    sph.r  = Math.max(fp*1.3, size.y*5, 30);
    sph.ph = Math.PI/4; sph.th = Math.PI/4;
    camera.near = sph.r*0.001; camera.far = sph.r*20;
    camera.updateProjectionMatrix();
  } else {
    sph = {th:Math.PI/4, ph:Math.PI/4, r:300};
  }
  camFromSph();
}

function clearAll(full=true) {
  objects.length = 0;
  for (const [, g] of Object.entries(layerGroups)) scene.remove(g);
  layerGroups = {}; layerVis = {};
  updateStats(); updateLayers();
  if (full) {
    document.getElementById('out-section').style.display    = 'none';
    document.getElementById('layers-section').style.display = 'none';
    document.getElementById('welcome').classList.remove('hidden');
  }
}

function focusAll() {
  if (!objects.length) return;
  const box = new THREE.Box3();
  objects.forEach(o => { if(o.mesh.visible) box.expandByObject(o.mesh); });
  target.copy(box.getCenter(new THREE.Vector3()));
  const size = box.getSize(new THREE.Vector3());
  sph.r = Math.max(Math.sqrt(size.x**2+size.z**2)*1.3, size.y*5, 30);
  camFromSph();
}

function toggleWire() {
  wireMode = !wireMode;
  document.getElementById('t-wire').classList.toggle('active', wireMode);
  objects.forEach(o => o.mesh.material.wireframe = wireMode);
}

function setView(v) {
  if (v==='top')   { sph.ph=0.02; }
  if (v==='front') { sph.ph=Math.PI/2; sph.th=0; }
  camFromSph();
}

function setSun(v) {
  document.getElementById('sv-sun').textContent = v+'°';
  const a = (v/90)*Math.PI/2;
  const r = objects.length ? sph.r : 200;
  sun.position.set(Math.cos(a)*r, Math.sin(a)*r, r*.6);
}

function setExplode(v) {
  document.getElementById('sv-exp').textContent = v;
  const amt = v/100;
  const offsets = {building:3,bridge:2,wall:1.5,fence:1,forest:2.5,road:.5,water:-.5,terrain:-1};
  objects.forEach(({mesh,cls}) => {
    const yo = (offsets[cls]||0) * amt * 20;
    mesh.position.y = (mesh.userData._origY||0) + yo;
  });
}

function setOpacity(v) {
  document.getElementById('sv-op').textContent = v+'%';
  const op = v/100;
  objects.forEach(({mesh}) => {
    mesh.material.transparent = op<1;
    mesh.material.opacity = op;
  });
}

// ── Measure ──────────────────────────────────────────────────
const ray = new THREE.Raycaster();
function toggleMeasure() {
  measureOn = !measureOn;
  mPts = [];
  document.getElementById('t-meas').classList.toggle('active', measureOn);
  document.getElementById('mtt').style.display = 'none';
  document.getElementById('sm').textContent = measureOn ? 'click 2 pts' : '—';
  toast(measureOn ? 'Click two points to measure' : 'Measure off');
}

canvas.addEventListener('click', e => {
  if (!measureOn) return;
  const rect = canvas.getBoundingClientRect();
  const mouse = new THREE.Vector2(
    ((e.clientX-rect.left)/rect.width)*2-1,
    -((e.clientY-rect.top)/rect.height)*2+1,
  );
  ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObjects(objects.map(o=>o.mesh));
  if (!hits.length) return;
  mPts.push(hits[0].point.clone());
  if (mPts.length===2) {
    const d = mPts[0].distanceTo(mPts[1]).toFixed(2);
    document.getElementById('sm').textContent = d+' m';
    toast(`Distance: ${d} m`);
    const geo  = new THREE.BufferGeometry().setFromPoints(mPts);
    const line = new THREE.Line(geo, new THREE.LineBasicMaterial({color:0x58a6ff}));
    scene.add(line);
    const tt = document.getElementById('mtt');
    tt.textContent = d+' m';
    tt.style.left  = (e.clientX-canvas.getBoundingClientRect().left+10)+'px';
    tt.style.top   = (e.clientY-canvas.getBoundingClientRect().top-20)+'px';
    tt.style.display = 'block';
    mPts = [];
  }
});

// ── Stats ────────────────────────────────────────────────────
function updateStats() {
  let v=0,t=0;
  objects.forEach(({mesh}) => {
    const g = mesh.geometry;
    v += g.attributes.position?.count||0;
    t += g.index ? g.index.count/3 : (g.attributes.position?.count||0)/3;
  });
  document.getElementById('sv').textContent = v.toLocaleString();
  document.getElementById('st').textContent = Math.round(t).toLocaleString();
  document.getElementById('so').textContent = objects.length;
}

// ── Compass ──────────────────────────────────────────────────
function drawCompass() {
  const c   = document.getElementById('compass');
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,52,52);
  ctx.strokeStyle='#21262d'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(26,26,22,0,Math.PI*2); ctx.stroke();
  ctx.save(); ctx.translate(26,26); ctx.rotate(-sph.th);
  ctx.fillStyle='#f78166';
  ctx.beginPath(); ctx.moveTo(0,-16); ctx.lineTo(3.5,2); ctx.lineTo(-3.5,2); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#21262d';
  ctx.beginPath(); ctx.moveTo(0,16); ctx.lineTo(3.5,-2); ctx.lineTo(-3.5,-2); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.fillStyle='#6e7681'; ctx.font='7px Inter,sans-serif'; ctx.textAlign='center';
  ctx.fillText('N',26,10);
}

// ── Toast ────────────────────────────────────────────────────
let _tt;
function toast(msg, err=false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show'+(err?' err':'');
  clearTimeout(_tt);
  _tt = setTimeout(() => el.className='', 3500);
}

// ── Helpers ──────────────────────────────────────────────────
function detectCls(name) {
  const n = name.toLowerCase();
  for (const [kw,cls] of [
    ['building','building'],['road','road'],['street','road'],
    ['water','water'],['river','water'],['lake','water'],
    ['forest','forest'],['tree','forest'],['plant','forest'],
    ['bridge','bridge'],['wall','wall'],['fence','fence'],
    ['terrain','terrain'],['ground','terrain'],
  ]) { if (n.includes(kw)) return cls; }
  return 'unknown';
}

function guessClass(name) {
  const n = name.toLowerCase();
  for (const [kw,cls] of [
    ['build','building'],['road','road'],['street','road'],
    ['water','water'],['river','water'],['lake','water'],
    ['forest','forest'],['tree','forest'],['park','terrain'],
    ['bridge','bridge'],['wall','wall'],['fence','fence'],
    ['terrain','terrain'],['ground','terrain'],
  ]) { if (n.includes(kw)) return cls; }
  return 'terrain';
}
