[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "geoforge"
version     = "1.0.0"
description = "Convert 2D map layers + LiDAR into 3D city models"
readme      = "README.md"
license     = { text = "MIT" }
requires-python = ">=3.9"
authors     = [{ name = "GeoForge contributors" }]
keywords    = ["3d", "gis", "lidar", "citygml", "cityjson", "city-model", "geospatial"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "geopandas>=0.14",
    "shapely>=2.0",
    "laspy[lazrs]>=2.5",
    "mapbox-earcut>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff", "black"]

[project.scripts]
geoforge = "geoforge.cli:main"

[project.urls]
Homepage = "https://github.com/your-username/geoforge"
Issues   = "https://github.com/your-username/geoforge/issues"

[tool.setuptools.packages.find]
include = ["geoforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
