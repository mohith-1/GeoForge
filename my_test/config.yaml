# GeoForge example config
pointcloud: data/pointcloud.las
output_dir: output
grid_resolution: 1.0
simplify_tolerance: 0.1
z_offset: 0.0

output_formats:
  - obj
  - cityjson
  - citygml
  - stl
  - postgis
  - csv

layers:
  - path: data/terrain.geojson
    class: terrain
    id_field: id

  - path: data/water.geojson
    class: water
    id_field: id

  - path: data/roads.geojson
    class: road
    id_field: id
    offset: 0.05

  - path: data/forest.geojson
    class: forest
    id_field: id
    min_height: 8.0

  - path: data/buildings.geojson
    class: building
    id_field: id
    height_field: building_height
    min_height: 3.0

  - path: data/bridges.geojson
    class: bridge
    id_field: id

  - path: data/walls.geojson
    class: wall
    id_field: id
    min_height: 2.0

  - path: data/fences.geojson
    class: fence
    id_field: id
    min_height: 1.2
